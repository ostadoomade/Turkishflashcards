<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>ترکی A1 · تمرین</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e8f84">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f6;--card:#fff;--tx:#232b32;--mut:#68737d;--line:#e1e5e8;--ac:#3f7c7a;--acd:#2f6361;--acs:#e5efee;--ok:#2f7a59;--oks:#e6f2ec;--bad:#a8473f;--bads:#f7e9e7;--warn:#a87a1f;--onac:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191c;--card:#1c2226;--tx:#e4e9ed;--mut:#8f9ca6;--line:#2c353b;--ac:#73b6b2;--acd:#5a9b97;--acs:#1f3534;--ok:#74c4a0;--oks:#1b2f27;--bad:#e4908a;--bads:#34211f;--warn:#d2a557;--onac:#10201f}}
:root[data-theme="dark"]{--bg:#15191c;--card:#1c2226;--tx:#e4e9ed;--mut:#8f9ca6;--line:#2c353b;--ac:#73b6b2;--acd:#5a9b97;--acs:#1f3534;--ok:#74c4a0;--oks:#1b2f27;--bad:#e4908a;--bads:#34211f;--warn:#d2a557;--onac:#10201f}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-weight:400;font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2,h3,p{margin:0;font-weight:500}
.tk{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:left}
#app{max-width:560px;margin:0 auto;min-height:100vh}
.pad{padding:18px 18px 100px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}
.mt{margin-top:12px}.mt2{margin-top:24px}
.btn{display:block;width:100%;padding:11px 16px;border-radius:10px;font-weight:500;text-align:center;background:var(--ac);color:var(--onac);transition:background .15s}
.btn:hover:not(:disabled){background:var(--acd)}
.btn.line{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.line:hover:not(:disabled){background:var(--acs)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:6px 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}.bar.ok>i{background:var(--ok)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--acs)}
.meta{font-size:13px;color:var(--mut);white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;padding:12px 4px;font-size:14px;color:var(--mut);border-top:2px solid transparent}
.nav button.on{color:var(--ac);border-top-color:var(--ac);font-weight:500}
h2.sec{font-size:17px;margin:26px 0 10px}
.unit{margin:26px 0 8px}
.unit .u{font-size:13px;color:var(--ac)}
.unit h3{font-size:18px}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:8px}
.trow:hover{background:var(--acs)}
.code{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--acs);color:var(--ac);font-weight:500;font-size:14px;direction:ltr}
.trow .bar{margin-top:7px}
.pct{flex:none;width:44px;text-align:end;font-size:14px;color:var(--mut)}
.next{display:flex;gap:12px;align-items:center;background:var(--acs);border-radius:12px;padding:14px 16px}
.ov{position:fixed;inset:0;background:rgba(10,15,18,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.x{font-size:22px;color:var(--mut);width:36px;height:36px;line-height:1;border-radius:8px}
.x:hover{background:var(--acs)}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--card)}
.chk i{flex:none;width:22px;height:22px;margin-top:3px;border-radius:6px;border:1.5px solid var(--mut);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.chk.on i{background:var(--ok);border-color:var(--ok)}
.chk small{display:block;color:var(--mut);font-size:12px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--acs);color:var(--ac);direction:ltr}
.lesson{display:flex;flex-direction:column;min-height:100vh}
.ltop{display:flex;align-items:center;gap:14px;padding:14px 18px 6px}
.ltop .bar{flex:1}
.lbody{flex:1;padding:14px 20px 170px}
.src{font-size:12px;color:var(--mut);display:block;margin-bottom:14px}
.ins{font-size:15px;color:var(--mut);font-weight:400}
.stem{font-size:26px;font-weight:500;margin:8px 0 6px;line-height:1.5;text-align:center;direction:ltr;word-break:break-word}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--mut);margin:0 4px;transform:translateY(3px)}
.trbox{margin:8px 0 4px;padding:10px 14px;border-radius:10px;background:var(--acs);font-size:15px}
.trbox .en{direction:ltr;text-align:left;color:var(--tx)}
.trbox .fa{margin-top:2px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:center;padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:18px}
.opt .t{direction:ltr}
.opt .tr{font-size:13px;color:var(--mut)}
.opt .tr.en{direction:ltr}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.no{border-color:var(--bad);background:var(--bads)}
.opt:disabled{cursor:default}
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.lfoot>div{max-width:560px;margin:0 auto}
.lfoot.ok{background:var(--oks)}.lfoot.bad{background:var(--bads)}
.fbt{font-size:18px;font-weight:500}
.lfoot.ok .fbt{color:var(--ok)}.lfoot.bad .fbt{color:var(--bad)}
.fbw{font-size:14px;margin:2px 0 10px}
.fbw .en{direction:ltr;text-align:left;color:var(--mut);font-size:13px}
.trtog{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;color:var(--ac);margin-top:18px;background:var(--card)}
.trtog.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.who{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:10px}
.who .av{width:46px;height:46px;font-size:24px}
.who b{display:block;font-weight:500}
.avs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.avs button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);font-size:22px;background:var(--card)}
.avs button.on{border-color:var(--ac);background:var(--acs)}
input[type=text],textarea{width:100%;font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
textarea{min-height:90px;font-size:12px;direction:ltr;font-family:ui-monospace,monospace}
.hero{text-align:center;padding:30px 0 6px}
.hero h1{font-size:30px;color:var(--ac)}
.hero p{color:var(--mut);margin-top:4px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;background:var(--card)}
.stat b{display:block;font-size:20px;font-weight:500}.stat span{font-size:12px;color:var(--mut)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.li:last-child{border-bottom:0}
.li .bar{width:80px;flex:none}
.big{font-size:40px;font-weight:500;line-height:1.2;color:var(--ac)}
.done{text-align:center;padding:40px 4px 10px}
.done h1{font-size:24px;margin:8px 0 4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:30;font-size:14px}
.stem.rtl,.opt .t.rtl{direction:rtl}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:240px;margin-top:6px;padding:28px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:center}
.fcard .fw{font-size:30px;font-weight:500;line-height:1.4;word-break:break-word}
.fcard .fm{font-size:22px;color:var(--ac);direction:rtl;line-height:1.7}
.fcard .fh{font-size:14px;color:var(--mut)}
.lfoot .row .btn{flex:1}
#app.wide{max-width:780px}
.lbody{display:flex;flex-direction:column;justify-content:center;padding:14px 22px 170px}
.qbox{width:100%}
.stem{font-size:clamp(22px,3.4vw,30px)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.opt{aspect-ratio:1/1;justify-content:center;align-items:center;padding:8px;font-size:clamp(14px,3.2vw,20px);overflow:hidden;overflow-wrap:anywhere;line-height:1.35}
.opt.hint{border-color:var(--ok);background:var(--oks)}
.tools{display:flex;justify-content:center;gap:14px;margin-top:22px}
.ibtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;display:grid;place-items:center}
.ibtn.on{background:var(--acs);border-color:var(--ac)}
.lfoot>div{max-width:780px}
.fbk{padding:9px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.fbk.ok{background:var(--oks);color:var(--ok)}.fbk.bad{background:var(--bads);color:var(--bad)}
.fbw2{margin-top:2px;color:var(--tx);font-size:13px}
:root{--bg:#eef3f8;--card:#fff;--tx:#14202b;--mut:#566474;--line:#d8e1ea;--ac:#0e8f84;--acd:#0a7168;--acs:#d9f2ef;--oks:#dcf4e6;--bads:#fbe3e0;
--c1:#0e9f91;--c2:#2f7de1;--c3:#8b5cf0;--c4:#ee8a1b;--c5:#e0488f;--c6:#2e9e50;--c7:#d9483b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#1a232c;--tx:#eef4f9;--mut:#9aabb9;--line:#2b3946;--ac:#4fd1c3;--acd:#36b3a6;--acs:#173a38;--oks:#173626;--bads:#3b2020;--c1:#4fd1c3;--c2:#6aa6ff;--c3:#b196ff;--c4:#ffab4a;--c5:#ff7fb6;--c6:#62d184;--c7:#ff8a7c}}
:root[data-theme="dark"]{--bg:#10171e;--card:#1a232c;--tx:#eef4f9;--mut:#9aabb9;--line:#2b3946;--ac:#4fd1c3;--acd:#36b3a6;--acs:#173a38;--oks:#173626;--bads:#3b2020;--c1:#4fd1c3;--c2:#6aa6ff;--c3:#b196ff;--c4:#ffab4a;--c5:#ff7fb6;--c6:#62d184;--c7:#ff8a7c}
body{font-size:17px;line-height:1.75}
.top{background:var(--card)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;padding:8px 2px 9px}
.nav button svg{stroke-width:1.6}
.nav button.on{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.unit{margin:28px 0 4px;padding-inline-start:12px;border-inline-start:4px solid var(--u)}
.unit .u{color:var(--u);font-weight:500}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tsq{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 8px 9px;border-radius:18px;border:1px solid color-mix(in srgb,var(--u) 35%,var(--line));background:color-mix(in srgb,var(--u) 9%,var(--card));text-align:center;min-width:0;transition:transform .12s,box-shadow .12s}
.tsq:hover{transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb,var(--u) 22%,transparent)}
.tsq .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--u) 20%,var(--card));color:var(--u)}
.tsq .nm{font-size:13.5px;line-height:1.4;font-weight:500;overflow-wrap:anywhere}
.tsq .trk{font-size:11px;color:var(--mut);font-weight:400}
.tsq .tprog{display:flex;align-items:center;gap:6px;width:100%}
.tsq .tprog .bar{flex:1;height:7px}
.tsq .tprog .bar>i{background:var(--u)}
.tsq .tprog b{font-size:11.5px;font-weight:500;color:var(--mut);white-space:nowrap}
.next{background:color-mix(in srgb,var(--ac) 14%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--line))}
.ic2{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--ac);color:var(--card)}
.btn{box-shadow:0 2px 6px color-mix(in srgb,var(--ac) 30%,transparent)}
.btn.line{box-shadow:none}
.opt{--oc:#3b82f6;border:1.5px solid color-mix(in srgb,var(--oc) 50%,var(--line));background:color-mix(in srgb,var(--oc) 9%,var(--card));font-weight:500}
.opt:nth-child(2){--oc:#f59e0b}.opt:nth-child(3){--oc:#a855f7}
.opt:hover:not(:disabled){border-color:var(--oc);transform:translateY(-2px)}
.opt.sel{border:2px solid var(--ac);background:var(--acs);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.opt.hint{border:2px solid var(--ok);background:var(--oks)}
.ibtn{color:var(--ac);width:48px;height:48px;border-color:color-mix(in srgb,var(--ac) 30%,var(--line))}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.ibtn.on{background:var(--ac);color:var(--card)}
.fbslot{min-height:70px;display:flex;align-items:flex-end;margin-bottom:10px}
.fbslot .fbk{width:100%;margin:0;padding:10px 14px;font-size:15px}
.stem{font-weight:700}
.bar{height:8px}
.src{color:var(--ac)}
.fcard .fw.num{font-size:clamp(22px,4.6vw,34px);letter-spacing:.5px}
.fcard .fm.l{direction:ltr;color:var(--ac);font-size:clamp(20px,4vw,28px);word-break:break-word}
</style>
</head>

<div id="app"></div>
<noscript>برای استفاده از این برنامه جاوااسکریپت لازم است.</noscript>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const faD=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const wpick=(items,ws)=>{let t=ws.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]};

/* ---------- Turkish helpers ---------- */
const VOW='aeıioöuü';
const FRX=new Set(['saat','harf','hal','rol','kalp','alkol','gol','hayal','ihtimal','usul']);
const FRM={a:'e',ı:'i',o:'ö',u:'ü'};
const lastV=w=>{for(let i=w.length-1;i>=0;i--)if(VOW.includes(w[i])){const v=w[i];return FRX.has(w)?(FRM[v]||v):v}return 'a'};
const isBack=v=>'aıou'.includes(v);
const h2=(w,a,e)=>isBack(lastV(w))?a:e;
const h4=w=>({a:'ı',ı:'ı',o:'u',u:'u',e:'i',i:'i',ö:'ü',ü:'ü'})[lastV(w)];
const endsV=w=>VOW.includes(w[w.length-1]);
const HARD='çfhkpsşt';
const hardEnd=w=>HARD.includes(w[w.length-1]);
const loc=w=>w+(hardEnd(w)?'t':'d')+h2(w,'a','e');
const abl=w=>loc(w)+'n';
const dat=w=>endsV(w)?w+'y'+h2(w,'a','e'):w+h2(w,'a','e');
const plural=w=>w+'l'+h2(w,'a','e')+'r';
const accu=w=>endsV(w)?w+'y'+h4(w):w+h4(w);
const mi=w=>'m'+h4(w);
const ONES=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'];
const TENS=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
function numTr(n){if(n===0)return 'sıfır';let s='';
 if(n>=1000){const k=Math.floor(n/1000);s+=(k===1?'':numTr(k)+' ')+'bin';n%=1000;if(n)s+=' '}
 if(n>=100){const h=Math.floor(n/100);s+=(h===1?'':ONES[h]+' ')+'yüz';n%=100;if(n)s+=' '}
 if(n>=10){s+=TENS[Math.floor(n/10)];n%=10;if(n)s+=' '}
 if(n)s+=ONES[n];return s.trim()}
const parseO=s=>{const [tr,en='',fa='']=s.split('|');return {tr,en,fa}};

/* ---------- Lexicons: "tr|en|fa" ---------- */

function norm(base,hid){const stem=Object.assign({},base.stem);let opts=base.opts.map(o=>Object.assign({},o));let srtl=false;
 if(hid!=null){ // hand-written (originally partly English): make everything Persian/Turkish only
  if(!stem.en&&stem.fa&&!hasFa(stem.tr)){stem.tr=stem.fa;stem.fa='';srtl=true}
  opts=opts.map(o=>{if(!o.en&&o.fa&&o.tr!==o.fa){return {tr:o.fa,en:'',fa:'',rtl:true}}return o})}
 opts=opts.map(o=>Object.assign({},o,{en:''}));stem.en='';
 return {stem,opts,srtl}}
function build(base,hid){const n=norm(base,hid);const q={top:base.top,sk:base.sk,code:base.code,type:base.type,stem:n.stem,srtl:n.srtl,why:base.why,hid};
 const idx=shuffle(n.opts.map((_,i)=>i));q.o=idx.map(i=>n.opts[i]);q.ci=idx.indexOf(0);q.key=base.type+'|'+base.stem.tr+'|'+base.opts[0].tr;q.src=srcLabel(q);return q}
function fromSkill(top,sk){const hs=[];HQ.forEach((q,i)=>{if(q.top===top&&q.sk===sk&&!L.recent.includes('h'+i))hs.push(i)});
 const gs=GENS[top+':'+sk]||[];const useG=gs.length&&(!hs.length||Math.random()<.7);
 if(useG)return build(pick(gs)());
 if(hs.length){const i=wpick(hs,hs.map(j=>(P.qs['h'+j]||{w:1}).w));return build(HQ[i],'h'+i)}
 const all=[];HQ.forEach((q,i)=>{if(q.top===top&&q.sk===sk)all.push(i)});if(all.length){const i=pick(all);return build(HQ[i],'h'+i)}
 return gs.length?build(pick(gs)()):null}
function weakPool(){const w=TOPIC_IDS.filter(id=>P.topics[id]&&P.topics[id].n>0&&tS(id).ema<.8);return w.length?w:TOPIC_IDS.filter(id=>P.topics[id]&&P.topics[id].n>0)}
function nextQ(){let top=L.topic,sk=L.skill;
 if(!top){const pool=L.mode==='weak'?weakPool():TOPIC_IDS;const fr=frontier();
  const ws=pool.map(id=>{const s=P.topics[id];const i=TOPIC_IDS.indexOf(id);if(!s||s.n<1)return (fr<0||i<=fr+1)&&L.mode!=='weak'?.6:.05;const b=Math.pow(1.15-s.ema,L.mode==='weak'?3:2)+.06;return b+(s.n<4?.3:0)});
  top=pool.length?wpick(pool,ws):TOPIC_IDS[0]}
 if(!sk){const sks=TOPICS[top].skills;sk=wpick(sks,sks.map(k=>{const s=P.skills[k];return !s||!s.n?.6:Math.pow(1.15-s.ema,2)+.08+(s.n<2?.4:0)}))}
 let q=null;for(let a=0;a<8;a++){q=fromSkill(top,sk);if(q&&!L.recent.includes(q.key))break}
 if(!q)q=fromSkill(top,TOPICS[top].skills[0]);return q}

function startLesson(mode,topic,skill){L={mode,topic:topic||null,skill:skill||null,len:10,correct:0,wrong:0,xp:0,recent:[],retry:[],asked:0,sel:null,hint:false,last:null,hist:[],fwd:[],q:null,showTr:!!P.tr,seen:{}};
 L.q=nextQ();L.recent.push(L.q.key);view='lesson';sheet=null;render()}
function showQ(q){L.q=q;L.sel=null;L.hint=false;L.recent.push(q.key);if(L.recent.length>14)L.recent.shift();render()}
function advance(){if(L.correct>=L.len){view='done';render();return}
 if(L.fwd.length){showQ(L.fwd.pop());return}
 let q;const due=L.retry.findIndex(r=>r.at<=L.asked);
 if(due>=0){q=L.retry.splice(due,1)[0].q}else if(L.retry.length&&L.asked>=L.len+8){q=L.retry.shift().q}else{q=nextQ()}
 showQ(q)}
function check(){if(L.sel==null)return;const q=L.q;const right=L.sel===q.ci;const hinted=L.hint;const good=right&&!hinted;
 const last={right,hinted,ans:q.o[q.ci].tr,why:whyHtml(q),review:!!q.done};
 if(q.done){L.hist.push(q);L.last=last;advance();return}
 L.asked++;record(q,good);q.done=true;
 if(good){L.correct++;L.xp+=10}else{L.wrong++;L.seen[q.top]=(L.seen[q.top]||0)+1;if(!q.retried)L.retry.push({q:Object.assign({},q,{retried:true,done:false}),at:L.asked+3})}
 L.hist.push(q);L.last=last;advance()}
function goBack(){if(!L.hist.length)return;L.fwd.push(L.q);L.q=L.hist.pop();L.sel=null;L.hint=false;render()}
function goSkip(){if(L.fwd.length){if(L.q.done)L.hist.push(L.q);L.q=L.fwd.pop();L.sel=null;L.hint=false;render();return}
 if(!L.q.done)L.retry.push({q:L.q,at:L.asked+4});else L.hist.push(L.q);advance()}

 return '<div class="pad"><h2 class="sec" style="margin-top:6px">۱۰۰۰ واژهٔ سخت ترکی</h2><div class="card"><div class="row"><div class="sp"><div class="big">'+faD(st.known)+'</div><div class="mut small">واژهٔ بلد از '+faD(st.tot)+'</div></div><div class="small mut" style="text-align:end">در حال یادگیری: '+faD(st.learn)+'<br>تازه: '+faD(st.fresh)+'</div></div><div class="mt">'+bar(pk,'ok')+'</div></div>'+
 '<button class="btn mt2" data-act="vstart">شروع فلش‌کارت (۲۰ کارت)</button><button class="btn line mt" data-act="vstart" data-w="1" '+(weak?'':'disabled')+'>مرور واژه‌های سخت</button>'+
 '<p class="mut small mt">کارتی که بلد نباشی زود برمی‌گردد؛ کارتی که بلد باشی کم‌کم کمتر می‌آید.</p><h2 class="sec">اعداد (بی‌پایان)</h2><div class="tgrid">'+Object.keys(NUMK).map((k,ki)=>{const st=(P.num||{})[k]||{n:0,g:0};const pp=st.n?Math.round(100*st.g/st.n):0;return '<button class="tsq" style="--u:'+CCOL[(ki+2)%7]+'" data-act="nstart" data-k="'+k+'"><span class="ic">'+ico(NUMK[k][1],24)+'</span><span class="nm">'+NUMK[k][0]+'</span><span class="tprog">'+bar(pp)+'<b>'+pc(pp)+'</b></span></button>'}).join('')+'</div><h2 class="sec">دسته‌های واژه</h2>'+
 '<div class="tgrid">'+VCATS.map((c,ci)=>{const s=vStats(c);const pp=Math.round(100*s.known/s.tot);return '<button class="tsq" style="--u:'+CCOL[ci%7]+'" data-act="vstart" data-c="'+esc(c)+'"><span class="ic">'+ico(CIC[c]||'star',24)+'</span><span class="nm">'+esc(c)+'</span><span class="tprog">'+bar(pp)+'<b>'+faD(s.known)+'/'+faD(s.tot)+'</b></span></button>'}).join('')+'</div></div>'}
function vCard(){const i=Vs.queue[0];const dyn=typeof i==='object';const w=dyn?{c:NUMK[i.kind][0],t:i.f,m:i.b}:VOC[i];const pct=Math.round(100*Vs.done/Vs.total);
 return '<div class="lesson"><div class="ltop"><button class="x" data-act="vquit" aria-label="خروج">✕</button>'+bar(pct)+'<span class="meta">'+faD(Vs.queue.length)+' مانده</span></div><div class="lbody"><span class="src">'+esc(w.c)+'</span>'+
 '<button class="fcard" data-act="vflip" aria-label="برگرداندن کارت"><div class="fw tk'+(dyn?' num':'')+'">'+esc(w.t)+'</div>'+(Vs.flip?(dyn?'<div class="fm l">'+esc(w.m)+'</div><div class="fh">'+esc(i.c)+'</div>':'<div class="fm">'+esc(w.m)+'</div>'):'<div class="fh">برای دیدن پاسخ ضربه بزن</div>')+'</button>'+
 '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn line sm" data-act="vspeak">تلفظ 🔊</button></div></div>'+
 (Vs.flip?'<div class="lfoot"><div class="row"><button class="btn line" data-act="vrate" data-r="again">نمی‌دانستم</button><button class="btn line" data-act="vrate" data-r="hard">سخت بود</button><button class="btn" data-act="vrate" data-r="good">بلد بودم</button></div></div>':'<div class="lfoot"><div><button class="btn" data-act="vflip">نمایش معنی</button></div></div>')+'</div>'}
function vVDone(){const again=Vs.kind?'data-act="nstart" data-k="'+Vs.kind+'"':'data-act="vstart"';const t=Vs.good+Vs.again+(Vs.total-Vs.good);return '<div class="pad"><div class="done"><h1>جلسهٔ واژگان تمام شد</h1><div class="stats"><div class="stat"><b>'+faD(Vs.total)+'</b><span>کارت</span></div><div class="stat"><b>'+faD(Vs.good)+'</b><span>بلد بودم</span></div><div class="stat"><b>'+faD(Vs.again)+'</b><span>تکرار شده</span></div></div><button class="btn mt2" '+again+(Vs.cat?' data-c="'+esc(Vs.cat)+'"':'')+'>جلسهٔ بعدی</button><button class="btn line mt" data-act="home">بازگشت</button></div></div>'}
function vProgress(){const sks=[];TOPIC_IDS.forEach(t=>TOPICS[t].skills.forEach(k=>{const s=P.skills[k];if(s)sks.push({k,t,s})}));
 const weak=sks.filter(x=>x.s.n>=3&&x.s.ema<.7).sort((a,b)=>a.s.ema-b.s.ema).slice(0,5);
 const strong=sks.filter(x=>x.s.n>=5&&x.s.ema>=.85).sort((a,b)=>b.s.ema-a.s.ema).slice(0,5);
 const li=x=>'<div class="li"><div class="sp"><div>'+esc(SFA[x.k])+'</div><div class="mut small">'+faD(x.t)+' · '+pc(Math.round(x.s.ema*100))+' اخیر · '+faD(x.s.n)+' پاسخ</div></div><button class="btn line sm" data-act="lesson" data-t="'+x.t+'" data-s="'+x.k+'">تمرین</button></div>';
 const vsx=vStats(null);
 return '<div class="pad"><div class="card" style="text-align:center"><div class="big">'+pc(overall())+'</div><div class="mut">تسلط بر گرامر</div><div class="mt">'+bar(overall())+'</div></div>'+
 '<div class="stats"><div class="stat"><b>'+faD(P.total)+'</b><span>پاسخ گرامر</span></div><div class="stat"><b>'+pc(acc())+'</b><span>دقت</span></div><div class="stat"><b>'+faD(P.streak)+'</b><span>روز پیاپی</span></div></div>'+
 '<div class="card"><div class="row"><div class="sp">واژگان: <b style="font-weight:500">'+faD(vsx.known)+'</b> از '+faD(vsx.tot)+' بلد</div><span class="mut small">'+faD(vsx.learn)+' در حال یادگیری</span></div><div class="mt">'+bar(Math.round(100*vsx.known/vsx.tot),'ok')+'</div></div>'+
 '<h2 class="sec">نیازمند تمرین</h2><div class="card">'+(weak.length?weak.map(li).join(''):'<span class="mut">هنوز نقطهٔ ضعفی ثبت نشده. با پاسخ دادن، نقاط ضعف اینجا نشان داده می‌شوند.</span>')+'</div>'+
 '<h2 class="sec">نقاط قوت</h2><div class="card">'+(strong.length?strong.map(li).join(''):'<span class="mut">بعد از چند پاسخ درست در یک مهارت، نقاط قوتت اینجا می‌آید.</span>')+'</div>'+
 '<h2 class="sec">همهٔ مبحث‌ها</h2>'+TOPIC_IDS.map(trow).join('')+'</div>'}
function vMe(){const th=DB.theme==='dark'?'تیره':DB.theme==='light'?'روشن':'خودکار';
 return '<div class="pad"><div class="card row"><span class="av" style="width:52px;height:52px;font-size:28px">'+P.av+'</span><div class="sp"><b style="font-weight:500;font-size:18px">'+esc(P.name)+'</b><div class="mut small">'+faD(P.xp)+' امتیاز · '+faD(P.streak)+' روز پیاپی</div></div></div>'+
 '<button class="btn mt2" data-act="logout">تعویض زبان‌آموز</button><button class="btn line mt" data-act="theme">پوسته: '+th+'</button><button class="btn line mt" data-act="backup">نمایش کد پشتیبان</button>'+
 (draft.bk?'<textarea class="mt" readonly id="bk" onfocus="this.select()">'+esc(draft.bk)+'</textarea><button class="btn line sm mt" data-act="copy">کپی</button>':'')+
 '<button class="btn danger mt2" data-act="reset">بازنشانی پیشرفت من</button><button class="btn danger mt" data-act="delete">حذف این زبان‌آموز</button>'+
 '<p class="mut small mt2">منبع گرامر: کتاب درسی (Ders Kitabı) و کتاب کار (Çalışma Kitabı) «İstanbul Yabancılar İçin Türkçe A1». زیر هر پرسش نوشته شده از کجاست؛ «پرسش تازه» و «فراتر از کتاب» از همان دستور (و سطح بالاتر) ساخته شده‌اند.</p></div>'}
function vHome(){const b=tab==='path'?vPath():tab==='practice'?vPractice():tab==='vocab'?vVocab():tab==='progress'?vProgress():vMe();return header()+b+nav()+(sheet?vSheet():'')}
function vSheet(){const id=sheet,T=TOPICS[id],m=mastery(id);const done=T.skills.filter(skDone).length;
 return '<div class="ov" data-act="closesheet"><div class="sheet" data-stop="1"><div class="row"><div class="sp"><span class="tag">'+id+'</span><h2 style="font-size:20px;margin-top:4px">'+esc(TFA[id])+'</h2><div class="mut small tk">'+esc(T.tr)+'</div></div><button class="x" data-act="closesheet" aria-label="بستن">✕</button></div>'+
 '<div class="mt">'+bar(m,barCls(m))+'<div class="mut small mt">'+pc(m)+' تسلط · '+faD(done)+' از '+faD(T.skills.length)+' مهارت تیک خورده</div></div>'+
 '<div class="mut small mt">'+(T.wp?'در کتاب‌ها: کتاب درسی بخش '+faD(id)+' · کتاب کار ص '+faD(T.wp):'فراتر از کتاب (سطح بالاتر از A1)')+'<br>دستور: '+esc(GFA[id])+'</div>'+
 '<h3 class="mt2" style="font-size:16px">فهرست توانایی‌ها</h3>'+T.skills.map(k=>{const s=sS(k),d=skDone(k);return '<button class="chk '+(d?'on':'')+'" data-act="skill" data-k="'+k+'"><i>'+(d?'✓':'')+'</i><span>'+esc(SFA[k])+'<small>'+(s.n?pc(Math.round(s.ema*100))+' اخیر · '+faD(s.n)+' پاسخ':'هنوز تمرین نشده')+(s.m!=null?' · تیک دستی':(d?' · تیک خودکار':''))+'</small></span></button>'}).join('')+
 '<button class="btn mt2" data-act="lesson" data-t="'+id+'">شروع درس</button></div></div>'}
function fmtStem(s){return esc(s).replace(/___/g,'<span class="blank"></span>')}
function whyHtml(q){const w=q.why||'';if(hasFa(w))return w;return WHYFA[w]||(q.code&&q.code[0]==='G'&&GWHY[q.sk])||''}
function vLesson(){const q=L.q;const pct=Math.min(100,Math.round(100*L.correct/L.len));const tr=L.showTr;
 let fb='<div class="fbslot">';if(L.last){const l=L.last,okk=l.right&&!l.hinted;fb+='<div class="fbk '+(okk?'ok':'bad')+'"><b>'+(l.hinted?'با راهنما بود — دوباره می‌آید':okk?'درست بود ✓':'نادرست بود ✗')+'</b>'+(okk?'':' · پاسخ درست: <b class="tk">'+esc(l.ans)+'</b>')+(!okk&&l.why?'<div class="fbw2">'+esc(l.why)+'</div>':'')+'</div>'}fb+='</div>';
 let h='<div class="lesson"><div class="ltop"><button class="x" data-act="quit" aria-label="خروج">✕</button>'+bar(pct)+'<span class="meta">'+faD(L.xp)+' امتیاز</span></div><div class="lbody"><div class="qbox">'+fb+
 '<span class="src">'+esc(q.src)+(q.done?' · مرور':'')+'</span><div class="ins">'+(INS[q.type]||'')+'</div>'+
 (q.stem.tr?'<div class="stem'+(q.srtl?' rtl':'')+'">'+fmtStem(q.stem.tr)+'</div>':'');
 if(tr&&q.stem.fa){h+='<div class="trbox"><div class="fa">'+esc(q.stem.fa)+'</div></div>'}
 h+='<div class="opts">'+q.o.map((o,i)=>{let c='opt';if(L.hint&&i===q.ci)c+=' hint';else if(i===L.sel)c+=' sel';
  return '<button class="'+c+'" data-act="opt" data-i="'+i+'"><span class="t'+(o.rtl?' rtl':'')+'">'+esc(o.tr)+'</span>'+(tr&&o.fa?'<span class="tr">'+esc(o.fa)+'</span>':'')+'</button>'}).join('')+'</div>'+
 '<div class="tools"><button class="ibtn" data-act="back" '+(L.hist.length?'':'disabled')+' aria-label="سؤال قبلی" title="سؤال قبلی">'+ico('prev',22)+'</button><button class="ibtn'+(tr?' on':'')+'" data-act="tr" aria-label="ترجمهٔ فارسی" title="ترجمهٔ فارسی">'+ico('globe',22)+'</button><button class="ibtn'+(L.hint?' on':'')+'" data-act="hint" aria-label="راهنما: نمایش پاسخ درست" title="راهنما">'+ico('help',22)+'</button><button class="ibtn" data-act="skip" aria-label="رد کردن سؤال" title="سؤال بعدی">'+ico('next',22)+'</button></div></div></div>';
 h+='<div class="lfoot"><div class="mut small" style="text-align:center">'+(L.sel==null?'یک گزینه را انتخاب کن':'برای ثبت پاسخ، دوباره روی همان گزینه کلیک کن')+'</div></div>';
 return h+'</div>'}
function vDone(){const tot=L.correct+L.wrong;const a=tot?Math.round(100*L.correct/tot):0;const miss=Object.keys(L.seen);
 return '<div class="pad"><div class="done"><h1>درس تمام شد</h1><div class="mut">کارت خوب بود</div><div class="stats"><div class="stat"><b>'+faD(L.xp)+'</b><span>امتیاز</span></div><div class="stat"><b>'+pc(a)+'</b><span>دقت</span></div><div class="stat"><b>'+faD(tot)+'</b><span>پرسش</span></div></div>'+
 (miss.length?'<p class="mut">این مبحث‌ها بیشتر تمرین داده می‌شوند: <b style="font-weight:500">'+miss.map(faD).join('، ')+'</b></p>':'<p class="mut">بدون اشتباه! این مبحث‌ها از این به بعد کمتر می‌آیند.</p>')+
 '<button class="btn mt2" data-act="again">ادامهٔ تمرین</button><button class="btn line mt" data-act="home">بازگشت به مسیر</button></div></div>'}

/* ---------- Render & events ---------- */
function applyTheme(){const d=document.documentElement;if(DB.theme)d.dataset.theme=DB.theme;else delete d.dataset.theme}
function render(){const a=$('#app');a.className=(view==='lesson'||view==='vocab')?'wide':'';a.innerHTML=view==='profiles'?vProfiles():view==='home'?vHome():view==='lesson'?vLesson():view==='vocab'?vCard():view==='vdone'?vVDone():vDone();applyTheme();window.scrollTo(0,0)}
function toast(t){clearTimeout(toastT);let e=$('.toast');if(!e||!e.remove){e=document.createElement('div');e.className='toast';document.body.appendChild(e)}e.textContent=t;toastT=setTimeout(()=>e&&e.remove&&e.remove(),2200)}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
function act(a,d,ev){
 switch(a){
 case 'login':P=DB.profiles[d.id];P.voc=P.voc||{};DB.current=d.id;save();view='home';tab='path';render();break;
 case 'logout':P=null;DB.current=null;save();view='profiles';draft={av:AVS[0]};render();break;
 case 'newuser':draft={av:draft.av||AVS[0],open:true};render();break;
 case 'cancel':draft={av:AVS[0]};render();break;
 case 'av':{const n=$('#nm');draft.name=n?n.value:'';draft.av=d.v;render();break}
 case 'create':{const n=($('#nm').value||'').trim();if(!n){toast('یک نام وارد کن');return}const p=newProfile(n,draft.av);DB.profiles[p.id]=p;DB.current=p.id;P=p;save();draft={av:AVS[0]};view='home';tab='path';render();break}
 case 'import':draft.imp=true;render();break;
 case 'doimport':try{const p=dec($('#imp').value);p.id='u'+Date.now().toString(36)+rnd(0,999);DB.profiles[p.id]=Object.assign(newProfile(p.name||'زبان‌آموز',p.av||AVS[0]),p);save();draft={av:AVS[0]};render();toast('بازیابی شد')}catch(e){toast('این کد معتبر نیست')}break;
 case 'tab':tab=d.v;render();break;
 case 'sheet':sheet=d.t;render();break;
 case 'closesheet':if(ev&&ev.target.closest&&ev.target.closest('[data-stop]')&&!ev.target.closest('.x'))return;sheet=null;render();break;
 case 'skill':{const s=P.skills[d.k]||(P.skills[d.k]={n:0,c:0,ema:.5,m:null});s.m=!skDone(d.k);save();render();break}
 case 'lesson':startLesson(d.m||(d.t?'topic':'mixed'),d.t,d.s);break;
 case 'opt':pickOpt(+d.i);break;
 case 'back':goBack();break;
 case 'skip':goSkip();break;
 case 'hint':if(!L.hint){L.hint=true;render()}break;
 case 'tr':L.showTr=!L.showTr;render();break;
 case 'trdef':P.tr=!P.tr;save();render();break;
 case 'quit':view='home';render();break;
 case 'again':startLesson(L.mode,L.topic,L.skill);break;
 case 'home':view='home';render();break;
 case 'vstart':startVocab(d.c||null,!!d.w);break;
 case 'vflip':Vs.flip=!Vs.flip;render();break;
 case 'vrate':vRate(d.r);break;
 case 'vspeak':{const it=Vs.queue[0];speak(typeof it==='object'?it.spk:VOC[it].t);break}
 case 'nstart':startNum(d.k);break;
 case 'vquit':view='home';render();break;
 case 'theme':DB.theme=DB.theme===null?'dark':DB.theme==='dark'?'light':null;save();render();break;
 case 'backup':draft.bk=enc(P);render();break;
 case 'copy':try{navigator.clipboard.writeText(draft.bk);toast('کپی شد')}catch(e){const t=$('#bk');if(t){t.select();toast('متن را انتخاب و کپی کن')}}break;
 case 'reset':if(confirm('پیشرفت '+P.name+' بازنشانی شود؟')){Object.assign(P,{xp:0,streak:0,lastDay:'',total:0,correct:0,topics:{},skills:{},qs:{},voc:{},today:{d:'',n:0}});save();render()}break;
 case 'delete':if(confirm(P.name+' برای همیشه حذف شود؟')){delete DB.profiles[P.id];P=null;DB.current=null;save();view='profiles';render()}break;
 }}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;act(t.dataset.act,t.dataset,e)});
document.addEventListener('keydown',e=>{if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'))return;
 if(view==='lesson'){if(['1','2','3'].includes(e.key))pickOpt(+e.key-1)}
 else if(view==='vocab'){if(e.key===' '||e.key==='Enter'){e.preventDefault();Vs.flip=!Vs.flip;render()}else if(Vs.flip&&e.key==='1')vRate('again');else if(Vs.flip&&e.key==='2')vRate('hard');else if(Vs.flip&&e.key==='3')vRate('good')}});
window.__t={act,startLesson,advance,check,pickOpt,getL:()=>L,setP:x=>{P=x},vHome,vPath,vPractice,vVocab,vProgress,vMe,vSheet,vProfiles,vDone,vLesson,vCard,vVDone,startVocab,vRate,getV:()=>Vs,setTab:x=>{tab=x},HQ,GENS,TOPICS,SKILLS,VOC,VCATS,TFA,SFA,WHYFA,GWHY};
if(DB.current&&DB.profiles[DB.current]){P=DB.profiles[DB.current];P.voc=P.voc||{};view='home'}
render();
})();
</script>
